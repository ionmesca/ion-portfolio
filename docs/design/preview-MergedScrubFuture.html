body { margin: 0; font-family: "Aeonik Pro", system-ui, -apple-system, sans-serif; color: #0c0a09; -webkit-font-smoothing: antialiased; }
a { color: #0c0a09; } a:hover { color: #44403b; }
.panel { position: relative; width: 1152px; height: 720px; background: #f5f5f4; border-radius: 21px; overflow: hidden; }
.card { background: #ffffff; border-radius: 12px; box-shadow: 0 0.5px 0.5px 0 rgb(0 0 0 / 0.04), 0 1.5px 1px 0 rgb(0 0 0 / 0.03), 0 3px 1.5px 0 rgb(0 0 0 / 0.02), 0 5px 2px 0 rgb(0 0 0 / 0.01), 0 0 0 1px rgb(0 0 0 / 0.05); color: #44403b; }
.tab { display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 8px; border-radius: 8px; font-size: 12px; font-weight: 500; color: #44403b; }
.tab-on { background: #ffffff; box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.04), 0 0 0 0.5px rgb(0 0 0 / 0.05); }
.dot { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.muted { color: #79716b; }
.num { font-variant-numeric: tabular-nums; }
.meter { display: flex; gap: 2px; height: 8px; border-radius: 2px; overflow: hidden; }
.seg-control { display: inline-flex; align-items: center; height: 32px; padding: 4px; gap: 0; border-radius: 12px; background: #f5f5f4; box-shadow: 0 0.5px 0.5px 0 rgb(0 0 0 / 0.04), 0 1.5px 1px 0 rgb(0 0 0 / 0.03), 0 0 0 1px rgb(0 0 0 / 0.05); }
.seg-item { display: inline-flex; align-items: center; justify-content: center; height: 24px; padding: 0 12px; border-radius: 9px; font-size: 13px; line-height: 1; color: #79716b; white-space: nowrap; }
.seg-on { background: #ffffff; color: #0c0a09; box-shadow: 0 0.5px 0.5px 0 rgb(0 0 0 / 0.04), 0 1.5px 1px 0 rgb(0 0 0 / 0.03), 0 0 0 1px rgb(0 0 0 / 0.05); }
.tip { position: absolute; background: #1c1917; color: #fafaf9; font-size: 12px; padding: 5px 9px; border-radius: 8px; white-space: nowrap; }
.note { position: absolute; font-size: 11px; line-height: 1.4; color: #79716b; background: #ffffff; border-radius: 6px; padding: 4px 8px; box-shadow: 0 0 0 1px rgb(0 0 0 / 0.05); }
