<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Wheel timeline prototype</title>
<script>
  // ---------------------------------------------------------------------
  // THE ONE KNOB. "all" shows every project at every scroll position (the
  // shipped default). Change to "tight" for the original 3-row window that
  // Ion is comparing against. No UI for this — it is a build-time choice.
  const CALM_WINDOW = "lens";       // "lens" | "all" | "tight"
  // ---------------------------------------------------------------------

  // drumH for "all" is derived, not guessed: with calm geometry the farthest
  // row (|o| = 4) has its outer edge at scale(0.92) * sin(48deg) * 212 + 32/2
  // = 159.66px from centre, so a 352px window clears it by 16.3px and the
  // 10px feather (2.84%) never touches a row.
  // "lens" is a different geometry, not just a different window. The five rows
  // sit at fixed 44px slots like a plain list, so there is no reserved space and
  // no void at either end; the active position travels down the list and a
  // proximity lens (push + scale + opacity) rides with it.
  //   pad 8px gives the lens room to push row 0 up / row 4 down without
  //   clipping; a matching negative margin cancels it so the visual gap from
  //   the actions row stays exactly 48px.
  const CALM_WINDOWS = {
    lens:  { mode: "lens", drumH: "224px", pad: "8px", maskA: "0%", maskB: "100%",
             opacityMin: 0.47, opacityEnd: 4.0, opacityPow: 2.2, cullAt: 99 },
    all:   { mode: "calm", drumH: "352px", pad: "0px", maskA: "2.84%", maskB: "97.16%",
             opacityMin: 0.47, opacityEnd: 4.0, opacityPow: 2.2, cullAt: 99 },
    tight: { mode: "calm", drumH: "150px", pad: "0px", maskA: "12%", maskB: "88%",
             opacityMin: 0.35, opacityEnd: 2.6, opacityPow: 1.0, cullAt: 2.5 },
  };
  window.__CALM_WIN__ = CALM_WINDOWS[CALM_WINDOW] || CALM_WINDOWS.lens;

  // Drum-box geometry per variant. Resolved before first paint so switching
  // never flashes the wrong drum height. ?variant= overrides the default.
  window.__WHEEL_GEO__ = {
    flat:     { drumH: "216px", persp: "700px", maskA: "20%", maskB: "80%", pad: "0px" },
    cylinder: { drumH: "150px", persp: "340px", maskA: "12%", maskB: "88%", pad: "0px" },
    calm:     { drumH: window.__CALM_WIN__.drumH, persp: "none",
                maskA: window.__CALM_WIN__.maskA, maskB: window.__CALM_WIN__.maskB,
                pad: window.__CALM_WIN__.pad },
  };
  (() => {
    // Sandboxed viewers can have an opaque origin where reading location
    // throws; fall back to the defaults rather than failing to boot.
    let q = null, a = null;
    try {
      const p = new URLSearchParams(location.search);
      q = p.get("variant");
      a = p.get("align");
    } catch (_) { /* no query available — defaults below */ }

    const name = window.__WHEEL_GEO__[q] ? q : "calm";
    const align = a === "right" ? "right" : "left";
    const g = window.__WHEEL_GEO__[name];
    const s = document.documentElement.style;
    s.setProperty("--drum-h", g.drumH);
    s.setProperty("--persp", g.persp);
    s.setProperty("--mask-a", g.maskA);
    s.setProperty("--mask-b", g.maskB);
    s.setProperty("--drum-pad", g.pad);
    document.documentElement.dataset.lens =
      String(name === "calm" && window.__CALM_WIN__.mode === "lens");
    document.documentElement.dataset.align = align;
    window.__WHEEL_VARIANT__ = name;
    window.__WHEEL_ALIGN__ = align;
  })();
</script>

:root {
  --stone-50:  #fafaf9;
  --stone-100: #f5f5f4;
  --stone-200: #e7e5e4;
  --stone-300: #d6d3d1;
  --stone-400: #a8a29e;
  --stone-500: #78716c;
  --stone-700: #44403c;
  --stone-800: #292524;
  --stone-950: #0c0a09;
  --white: #ffffff;

  --background: var(--white);
  --foreground: var(--stone-950);
  --muted: var(--stone-100);
  --muted-foreground: var(--stone-500);
  --border: var(--stone-200);
  --primary: #1c1917;
  --primary-foreground: var(--stone-50);

  --radius-sm: 9px;
  --radius-md: 12px;
  --radius-lg: 15px;
  --radius-xl: 21px;

  --shadow-raised:
    0 1px 1px rgba(12,10,9,.04),
    0 3px 2px rgba(12,10,9,.03),
    0 6px 3px rgba(12,10,9,.02),
    0 10px 4px rgba(12,10,9,.01),
    0 0 0 1px rgba(12,10,9,.05);

  /* drum geometry — written by the <head> script per variant */
  --drum-h: 150px;
  --drum-pad: 0px;   /* lens breathing room, cancelled by a negative margin */
  --row-pitch: 44px;
  --persp: none;
  --mask-a: 12%;
  --mask-b: 88%;
  --row-h: 32px;
}

*, *::before, *::after { box-sizing: border-box; }

html { background: var(--background); }

body {
  margin: 0;
  background: var(--background);
  color: var(--foreground);
  font-family: "Aeonik Pro", ui-sans-serif, system-ui, sans-serif;
  font-weight: 400;
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-synthesis-weight: none;
}

button { font: inherit; color: inherit; background: none; border: 0; margin: 0; padding: 0; }

:focus-visible { outline: 2px solid var(--stone-400); outline-offset: 2px; }

/* ---------------------------------------------------------------- left rail */

.rail {
  position: fixed;
  left: 164px;
  top: 136px;
  bottom: 48px;
  width: 263px;
  display: flex;
  flex-direction: column;
  z-index: 2;
}

.rail-top {
  display: flex;
  flex-direction: column;
  gap: 48px;
}

/* identity chip */
.identity {
  height: 42px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 8px 4px 4px;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-raised);
}
.identity-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--stone-300);
  flex: none;
}
.identity-name {
  flex: 1 1 auto;
  font-size: 15px;
  font-weight: 500;
  letter-spacing: -0.005em;
  color: var(--foreground);
}
.kbd {
  flex: none;
  height: 24px;
  padding: 0 8px;
  display: inline-flex;
  align-items: center;
  gap: 1px;
  background: var(--muted);
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 400;
  color: var(--muted-foreground);
}

/* headline */
.headline {
  font-size: 18px;
  font-weight: 500;
  line-height: 1.44;
  letter-spacing: -0.012em;
  margin: 0;
  color: var(--muted-foreground);
}
.headline .title {
  display: block;
  color: var(--foreground);
}
.headline .u {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 3px;
  text-decoration-color: var(--stone-300);
}

/* actions */
.actions {
  display: flex;
  align-items: center;
  gap: 16px;
}
.btn-primary {
  height: 32px;
  padding: 0 12px;
  display: inline-flex;
  align-items: center;
  border-radius: var(--radius-md);
  background: var(--primary);
  color: var(--primary-foreground);
  font-size: 14px;
  font-weight: 500;
  letter-spacing: -0.005em;
  box-shadow: var(--shadow-raised);
  cursor: pointer;
  transition: opacity 140ms linear;
}
.btn-primary:hover { opacity: .88; }
.socials { display: flex; align-items: center; gap: 8px; }
.social {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--stone-400);
}

/* ------------------------------------------------------------------- drum */

.drum-block {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.drum-mask {
  height: var(--drum-h);
  /* The negative vertical margin cancels --drum-pad, so the lens can overshoot
     the list without the box adding any visible space above or below it. */
  margin: calc(-1 * var(--drum-pad)) -12px;
  padding: 0 12px;
  overflow: hidden;
  -webkit-mask-image: linear-gradient(to bottom,
    rgba(0,0,0,0) 0%, rgba(0,0,0,1) var(--mask-a),
    rgba(0,0,0,1) var(--mask-b), rgba(0,0,0,0) 100%);
  mask-image: linear-gradient(to bottom,
    rgba(0,0,0,0) 0%, rgba(0,0,0,1) var(--mask-a),
    rgba(0,0,0,1) var(--mask-b), rgba(0,0,0,0) 100%);
}

.drum {
  position: relative;
  height: var(--drum-h);
  perspective: var(--persp);
  perspective-origin: left center;
}

.row {
  position: absolute;
  left: 0;
  right: 0;
  top: calc((var(--drum-h) - var(--row-h)) / 2);
  /* lens: a plain static list — row i lives at its own 44px slot */
  
  height: var(--row-h);
  display: flex;
  align-items: center;
  gap: 8px;
  text-align: left;            /* rows are <button>s — kill the UA's centering */
  padding: 4px 12px 4px 4px;   /* tight to the thumbnail, roomy by the year */
  border-radius: var(--radius-md);
  transform-origin: left center;
  backface-visibility: hidden;
  will-change: transform, opacity;
  cursor: pointer;
  isolation: isolate;
}

.row-layer {
  position: absolute;
  inset: 0;
  border-radius: var(--radius-md);
  background: var(--muted);
  z-index: -1;
  pointer-events: none;
}
.row-hover { opacity: 0; transition: opacity 130ms linear; }
.row:hover .row-hover { opacity: .6; }
.row-fill { opacity: 0; }

.row-icon {
  flex: none;
  width: 24px;
  height: 24px;
  border-radius: 8px;
  background: var(--stone-300);
}
.row-name {
  flex: 1 1 auto;
  min-width: 0;
  font-size: 15px;
  font-weight: 500;
  letter-spacing: -0.005em;
  color: var(--foreground);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.row-year {
  flex: none;
  font-size: 15px;
  font-weight: 500;
  letter-spacing: -0.005em;
  color: var(--muted-foreground);
  font-variant-numeric: tabular-nums;
  /* Opacity + x-drift are driven per frame from the same signal as the active
     fill, so the date arrives with the settle. The element always keeps its
     box, so revealing it never reflows the name column. */
  opacity: 0;
  will-change: transform, opacity;
}

/* ---- alignment feel-test: mirror the whole row anatomy ---- */
:root[data-lens="true"] .row {
  top: calc(var(--drum-pad) + var(--slot) * var(--row-pitch));
}

:root[data-align="right"] .drum { perspective-origin: right center; }
:root[data-align="right"] .row {
  flex-direction: row-reverse;          /* year | name | thumbnail */
  padding: 4px 4px 4px 12px;            /* exact mirror of the left build */
  transform-origin: right center;       /* bunching hinges on the right edge */
}
:root[data-align="right"] .row-name { text-align: right; }

.drum-hint {
  margin: 0;
  padding: 0 12px;
  font-size: 12px;
  font-weight: 400;
  color: var(--stone-400);
}

/* footer */
.rail-footer {
  margin: auto 0 0;
  font-size: 12px;
  font-weight: 400;
  color: var(--muted-foreground);
}

/* --------------------------------------------------------- right column */

.stage {
  margin-left: 475px;
  width: min(1013px, calc(100% - 475px - 24px));
  padding-top: 136px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.panel {
  height: 538px;
  border-radius: var(--radius-xl);
  background: var(--muted);
  display: flex;
  align-items: center;
  justify-content: center;
  flex: none;
}
.panel-caption {
  font-size: 12px;
  font-weight: 400;
  color: var(--stone-400);
}

.end-spacer { height: 55vh; flex: none; }

/* ------------------------------------------------------- variant toggle */

.toggles {
  position: fixed;
  right: 24px;
  bottom: 24px;
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 8px;
}
.seg {
  display: flex;
  gap: 2px;
  padding: 3px;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-raised);
}
.seg-label {
  height: 24px;
  padding: 0 4px 0 7px;
  display: inline-flex;
  align-items: center;
  font-size: 12px;
  font-weight: 400;
  color: var(--stone-400);
}
.seg button {
  height: 24px;
  padding: 0 10px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 400;
  color: var(--muted-foreground);
  cursor: pointer;
  transition: color 120ms linear, background-color 120ms linear;
}
.seg button:hover { color: var(--foreground); }
.seg button[data-on="true"] {
  background: var(--muted);
  color: var(--foreground);
  font-weight: 500;
}

@media (prefers-reduced-motion: reduce) {
  .row-hover { transition: none; }
  .btn-primary { transition: none; }
  .seg button { transition: none; }
}
</style>
</head>
<body>

<aside class="rail">
  <div class="rail-top">

    <div class="identity">
      <div class="identity-avatar"></div>
      <div class="identity-name">Ion Mesca</div>
      <div class="kbd">⌘K</div>
    </div>

    <p class="headline">
      <span class="title">Software Designer</span>
      Curious generalist at heart, building AI native software and fintech
      systems at <span class="u">Ledgy</span>
    </p>

    <div class="actions">
      <button class="btn-primary" type="button">Book a call</button>
      <div class="socials">
        <span class="social"></span>
        <span class="social"></span>
        <span class="social"></span>
      </div>
    </div>

    <div class="drum-block">
      <div class="drum-mask">
        <div class="drum" id="drum"></div>
      </div>
      <p class="drum-hint">scroll the images →</p>
    </div>

  </div>

  <p class="rail-footer">Updated Aug 16, 2026</p>
</aside>

<main class="stage" id="stage"></main>

<div class="toggles">
  <div class="seg" id="variant-toggle" role="group" aria-label="Wheel variant">
    <button type="button" data-variant="flat">Flat</button>
    <button type="button" data-variant="cylinder">Drum</button>
    <button type="button" data-variant="calm">Calm</button>
  </div>
  <div class="seg" id="align-toggle" role="group" aria-label="Row alignment">
    <span class="seg-label">Align</span>
    <button type="button" data-align="left">Left</button>
    <button type="button" data-align="right">Right</button>
  </div>
</div>

<script>
(() => {
  "use strict";

  /* ------------------------------------------------------------- data */

  const PROJECTS = [
    { name: "Ledgy Agent",      year: "2026", panels: 3 },
    { name: "Hey Buna App",     year: "2026", panels: 2 },
    { name: "Equity Dashboard", year: "2025", panels: 3 },
    { name: "Ripple Agent",     year: "2024", panels: 2 },
    { name: "Vesting builder",  year: "2026", panels: 2 },
  ];

  /* Scroll mapping is shared by all variants; only the drum look differs. */
  const SCROLL = {
    lerp: 0.12,       // per 60fps frame, converted to be framerate-independent
    refLine: 0.40,    // reference line, as a fraction of viewport height
    handoff: 400,     // px window, ending at a project boundary, over which f advances by 1
    jumpOffset: 136,  // px from viewport top where a panel lands on click-to-jump
  };

  // Rows past cullAt fade to nothing rather than degrade into slivers. In the
  // "all" window cullAt is 99, i.e. off — every project stays on screen and
  // stays clickable at every scroll position.
  const CULL_FADE = 0.35;   // |o| span over which the cull fade happens
  const YEAR_DRIFT = 4;     // px the date travels as it fades in
  const CALM_WIN = window.__CALM_WIN__;

  const VARIANTS = {
    // DEFAULT. Deliberately non-physical: bunching and a uniform scale falloff
    // give the depth read, but there is NO rotateX, so text never shears.
    calm: {
      // "lens" swaps the whole geometry: static slots + a travelling lens.
      mode: CALM_WIN.mode,
      spread: 6,        // px a neighbour is pushed away from the active row
      spreadEnd: 2.5,   // |o| where the push returns to 0 (natural slot)
      lensScaleEnd: 0.95,
      lensScaleRef: 2,
      radius: 212,      // px; sin(12deg) * 212 = 44.1, so centre pitch stays 44
      step: 12,         // deg per row of offset (positional only)
      scaleEnd: 0.92,   // uniform scale at |o| = scaleRef
      scaleRef: 2.5,
      // Falloff comes from the window preset. With "all" the curve matches the
      // old one at |o| = 1 (0.751 vs 0.750) then flattens, so the farthest row
      // still reads at 0.47 instead of dropping to the old 0.35 floor.
      opacityMin: CALM_WIN.opacityMin,
      opacityEnd: CALM_WIN.opacityEnd,
      opacityPow: CALM_WIN.opacityPow,
      cullAt: CALM_WIN.cullAt,
      blurStart: 1.6, blurEnd: 2.2, blurMax: 0.4,
      fillOut: 0.35,
    },
    // True cylinder. Physically honest, but rotateX shears the text.
    cylinder: {
      mode: "cylinder",
      radius: 158,
      step: 16,
      opacityMin: 0.35,
      opacityEnd: 2.6,
      opacityPow: 1.0,
      cullAt: 2.5,
      blurStart: 1.6, blurEnd: 2.2, blurMax: 0.4,
      fillOut: 0.35,
    },
    // The original flat drum, kept for A/B.
    flat: {
      mode: "flat",
      pitch: 44,
      tilt: -16,
      opacityMin: 0.35,
      opacityEnd: 2.0,
      opacityPow: 1.0,
      cullAt: 2.5,
      blurStart: 1.6, blurEnd: 2.2, blurMax: 0.4,
      fillOut: 1.0,
    },
  };

  const GEO = window.__WHEEL_GEO__;
  const DEG = Math.PI / 180;

  const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
  const smoothstep = (a, b, x) => {
    const t = clamp((x - a) / (b - a), 0, 1);
    return t * t * (3 - 2 * t);
  };

  const reduceMotion =
    window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  let V = VARIANTS[window.__WHEEL_VARIANT__] || VARIANTS.calm;

  /* ---------------------------------------------------------- build DOM */

  const stage = document.getElementById("stage");
  const drum = document.getElementById("drum");

  const firstPanelEls = [];
  const frag = document.createDocumentFragment();

  PROJECTS.forEach((p, k) => {
    for (let n = 1; n <= p.panels; n++) {
      const panel = document.createElement("div");
      panel.className = "panel";
      panel.id = "panel-" + k + "-" + n;
      const cap = document.createElement("span");
      cap.className = "panel-caption";
      cap.textContent = p.name + " — image " + n + "/" + p.panels;
      panel.appendChild(cap);
      frag.appendChild(panel);
      if (n === 1) firstPanelEls[k] = panel;
    }
  });
  const spacer = document.createElement("div");
  spacer.className = "end-spacer";
  frag.appendChild(spacer);
  stage.appendChild(frag);

  const freshState = () =>
    ({ t: "", o: -1, b: -1, f: -1, z: 0, p: "", y: -1, yx: "" });

  const rows = PROJECTS.map((p, i) => {
    const el = document.createElement("button");
    el.type = "button";
    el.className = "row";
    el.dataset.index = String(i);

    const hover = document.createElement("span");
    hover.className = "row-layer row-hover";
    const fill = document.createElement("span");
    fill.className = "row-layer row-fill";
    const icon = document.createElement("span");
    icon.className = "row-icon";
    const name = document.createElement("span");
    name.className = "row-name";
    name.textContent = p.name;
    const year = document.createElement("span");
    year.className = "row-year";
    year.textContent = p.year;

    el.style.setProperty("--slot", String(i));
    el.append(hover, fill, icon, name, year);
    drum.appendChild(el);
    return { el, fill, year, state: freshState() };
  });

  /* ------------------------------------------------- scroll -> f mapping */

  // boundaries[k] = document Y of the top of project k's first panel.
  let boundaries = [];
  let viewportH = window.innerHeight;

  function measure() {
    viewportH = window.innerHeight;
    const sy = window.scrollY;
    boundaries = firstPanelEls.map(el => el.getBoundingClientRect().top + sy);
  }

  // f in [0, 4]. Each project boundary contributes one smooth 0->1 step,
  // completing exactly as that project's first panel top crosses the
  // reference line at 40% viewport height.
  function targetF(scrollY) {
    const ref = scrollY + SCROLL.refLine * viewportH;
    let f = 0;
    for (let k = 1; k < boundaries.length; k++) {
      const b = boundaries[k];
      f += smoothstep(b - SCROLL.handoff, b, ref);
    }
    return f;
  }

  /* ------------------------------------------------------------ render */

  // Row i's transform for drum offset o. Every variant collapses to the
  // identity transform at o = 0, so the active row is pixel-identical
  // across all three.
  function transformFor(o) {
    const ao = o < 0 ? -o : o;

    if (V.mode === "lens") {
      // Rows already sit at their own slots, so the transform carries only the
      // lens: a push away from the active row that peaks at |o| = 1 and is back
      // to zero by |o| = 2.5, plus a gentle scale. No rotation, no shear.
      const bump = ao <= 1
        ? smoothstep(0, 1, ao)
        : 1 - smoothstep(1, V.spreadEnd, ao);
      const d = (o < 0 ? -1 : 1) * V.spread * bump;
      const s = 1 - (1 - V.lensScaleEnd) * smoothstep(0, V.lensScaleRef, ao);
      return "translateY(" + d.toFixed(2) + "px) scale(" + s.toFixed(4) + ")";
    }

    if (V.mode === "calm") {
      // scale() is applied BEFORE translateY in the matrix chain, so the row
      // position is scaled too — that is what produces the bunching. No
      // rotateX anywhere, so glyphs stay perfectly upright.
      const s = 1 - (1 - V.scaleEnd) * clamp(ao / V.scaleRef, 0, 1);
      const ty = Math.sin(o * V.step * DEG) * V.radius;
      return "scale(" + s.toFixed(4) + ") translateY(" + ty.toFixed(2) + "px)";
    }

    if (V.mode === "cylinder") {
      const th = o * V.step * DEG;
      const ty = Math.sin(th) * V.radius;
      const tz = (Math.cos(th) - 1) * V.radius;
      return "translateY(" + ty.toFixed(2) + "px) translateZ(" +
        tz.toFixed(2) + "px) rotateX(" + (o * -V.step).toFixed(2) + "deg)";
    }

    return "translateY(" + (o * V.pitch).toFixed(2) + "px) rotateX(" +
      (o * V.tilt).toFixed(2) + "deg)";
  }

  let fRender = 0;
  let lastScroll = -1;
  let lastTime = 0;
  let needsWrite = true;

  function write(f) {
    for (let i = 0; i < rows.length; i++) {
      const r = rows[i];
      const o = i - f;
      const ao = o < 0 ? -o : o;

      const t = transformFor(o);

      // Fade to nothing before a row can degrade into a sliver. Disabled in
      // the "all" window (cullAt 99), where nothing is ever clipped.
      const cull = 1 - smoothstep(V.cullAt - CULL_FADE, V.cullAt, ao);
      const falloff = Math.pow(1 - clamp(ao / V.opacityEnd, 0, 1), V.opacityPow);
      const opacity = +(
        (V.opacityMin + (1 - V.opacityMin) * falloff) * cull
      ).toFixed(3);

      const blur = +(
        V.blurMax * clamp((ao - V.blurStart) / (V.blurEnd - V.blurStart), 0, 1)
      ).toFixed(2);

      const fillAmt = +(1 - smoothstep(0, V.fillOut, ao)).toFixed(3);
      const z = 10 - Math.round(clamp(ao, 0, 4) * 2);
      const pe = opacity < 0.02 ? "none" : "auto";

      // The date rides the same signal as the active fill, so it arrives with
      // the settle rather than popping. It drifts in from the side the row is
      // travelling from: rows rising from below lean in from +x, and vice versa.
      const yearX = ((o < 0 ? -1 : 1) * YEAR_DRIFT * (1 - fillAmt)).toFixed(2);
      const yx = "translateX(" + yearX + "px)";

      const s = r.state;
      if (s.t !== t) { r.el.style.transform = t; s.t = t; }
      if (s.o !== opacity) { r.el.style.opacity = opacity; s.o = opacity; }
      if (s.b !== blur) {
        r.el.style.filter = blur > 0.01 ? "blur(" + blur + "px)" : "none";
        s.b = blur;
      }
      if (s.f !== fillAmt) { r.fill.style.opacity = fillAmt; s.f = fillAmt; }
      if (s.z !== z) { r.el.style.zIndex = String(z); s.z = z; }
      if (s.p !== pe) { r.el.style.pointerEvents = pe; s.p = pe; }
      if (s.y !== fillAmt) { r.year.style.opacity = fillAmt; s.y = fillAmt; }
      if (s.yx !== yx) { r.year.style.transform = yx; s.yx = yx; }
    }

    const active = Math.round(f);
    for (let i = 0; i < rows.length; i++) {
      const on = i === active;
      if (rows[i].el.dataset.active !== String(on)) {
        rows[i].el.dataset.active = String(on);
        if (on) rows[i].el.setAttribute("aria-current", "true");
        else rows[i].el.removeAttribute("aria-current");
      }
    }
  }

  function frame(now) {
    const dt = lastTime ? clamp(now - lastTime, 1, 50) : 16.667;
    lastTime = now;

    // one scroll read per frame, before any style writes
    const sy = window.scrollY;

    if (sy !== lastScroll) { lastScroll = sy; needsWrite = true; }

    const target = targetF(sy);

    if (reduceMotion) {
      if (fRender !== target) { fRender = target; needsWrite = true; }
    } else {
      const alpha = 1 - Math.pow(1 - SCROLL.lerp, dt / 16.667);
      const diff = target - fRender;
      if (Math.abs(diff) > 0.0004) {
        fRender += diff * alpha;
        needsWrite = true;
      } else if (fRender !== target) {
        fRender = target;
        needsWrite = true;
      }
    }

    if (needsWrite) {
      write(fRender);
      needsWrite = false;
    }

    requestAnimationFrame(frame);
  }

  /* ------------------------------------------------------- click to jump */

  drum.addEventListener("click", (e) => {
    const btn = e.target.closest(".row");
    if (!btn) return;
    const k = +btn.dataset.index;
    const top = Math.max(0, boundaries[k] - SCROLL.jumpOffset);
    window.scrollTo({ top, behavior: reduceMotion ? "auto" : "smooth" });
  });

  /* ---------------------------------------------------- variant toggle */

  const toggle = document.getElementById("variant-toggle");
  const toggleBtns = [...toggle.querySelectorAll("button")];
  const alignToggle = document.getElementById("align-toggle");
  const alignBtns = [...alignToggle.querySelectorAll("button")];

  // Sandboxed viewers block URL/history — every caller must tolerate this
  // failing, so the toggles stay usable even when the address bar cannot.
  function syncUrl() {
    try {
      const u = new URL(location.href);
      u.searchParams.set("variant", window.__WHEEL_VARIANT__);
      u.searchParams.set("align", window.__WHEEL_ALIGN__);
      history.replaceState(null, "", u);
    } catch (_) { /* no-op: toggles still work without URL state */ }
  }

  function applyAlign(name) {
    const align = name === "right" ? "right" : "left";
    document.documentElement.dataset.align = align;
    window.__WHEEL_ALIGN__ = align;

    for (const b of alignBtns) {
      const on = b.dataset.align === align;
      b.dataset.on = String(on);
      b.setAttribute("aria-pressed", String(on));
    }

    for (const r of rows) r.state = freshState();
    needsWrite = true;
    syncUrl();
  }

  alignToggle.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (b) applyAlign(b.dataset.align);
  });

  function applyVariant(name) {
    if (!VARIANTS[name]) name = "calm";
    V = VARIANTS[name];

    const g = GEO[name];
    const s = document.documentElement.style;
    s.setProperty("--drum-h", g.drumH);
    s.setProperty("--persp", g.persp);
    s.setProperty("--mask-a", g.maskA);
    s.setProperty("--mask-b", g.maskB);
    s.setProperty("--drum-pad", g.pad);

    // Lens layout is calm-only. Flat/Drum must fall back to centre-anchored
    // rows, or they would inherit the static 44px slots and stack wrongly.
    document.documentElement.dataset.lens =
      String(name === "calm" && CALM_WIN.mode === "lens");

    for (const r of rows) r.state = freshState();
    needsWrite = true;

    for (const b of toggleBtns) {
      const on = b.dataset.variant === name;
      b.dataset.on = String(on);
      b.setAttribute("aria-pressed", String(on));
    }

    window.__WHEEL_VARIANT__ = name;
    syncUrl();
  }

  toggle.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (b) applyVariant(b.dataset.variant);
  });

  /* -------------------------------------------------------------- boot */

  measure();
  applyAlign(window.__WHEEL_ALIGN__);
  applyVariant(window.__WHEEL_VARIANT__);
  fRender = targetF(window.scrollY);
  write(fRender);

  window.addEventListener("resize", () => { measure(); needsWrite = true; });
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => { measure(); needsWrite = true; });
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
